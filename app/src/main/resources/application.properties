# Application Configuration
spring.application.name=skeleton-module-app

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Logging Configuration
logging.level.root=INFO
logging.level.net.skeleton=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Database (Development)
spring.datasource.url=jdbc:h2:mem:skeletondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PostgreSQL (Production - uncomment when needed)
#spring.datasource.url=jdbc:postgresql://localhost:5432/skeletondb
#spring.datasource.username=postgres
#spring.datasource.password=postgres

# MongoDB Configuration (uncomment if using MongoDB)
#spring.data.mongodb.uri=mongodb://localhost:27017/skeletondb

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.remoteService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.remoteService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.remoteService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.remoteService.failureRateThreshold=50

# Resilience4j Retry Configuration
resilience4j.retry.instances.remoteService.maxAttempts=3
resilience4j.retry.instances.remoteService.waitDuration=1s
resilience4j.retry.instances.remoteService.enableExponentialBackoff=true
resilience4j.retry.instances.remoteService.exponentialBackoffMultiplier=2

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

